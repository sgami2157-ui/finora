name: Build Android APK
# Jalankan manual: tab Actions → "Build Android APK" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL aplikasi web (produksi)"
        default: "https://finora-appfuture.vercel.app"
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Atur URL aplikasi
        run: node -e "const f='capacitor.config.json',c=require('./'+f);const u='${{ inputs.url }}';c.server.url=u;c.server.allowNavigation[0]=new URL(u).host;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#FF8A3D' --iconBackgroundColorDark '#FF8A3D'
      - run: npx cap sync android
      - name: Build APK debug
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Build APK rilis bertanda tangan (jika secret tersedia)
        if: ${{ env.KS != '' }}
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: mobile/android
        run: |
          echo "$KS" | base64 -d > ../release.keystore
          ./gradlew assembleRelease
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/finora-aligned.apk
          $BT/apksigner sign --ks ../release.keystore --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --out app/build/outputs/apk/release/finora-release.apk app/build/outputs/apk/release/finora-aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: finora-apk
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/finora-release.apk
